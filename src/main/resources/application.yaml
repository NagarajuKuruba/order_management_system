spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order_management
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false

    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

app:
  rabbitmq:
    exchange: order.exchange
    queue: order.queue
    routing-key: order.created

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha

  api-docs:
    path: /v3/api-docs

# Logging Configuration
logging:
  level:
    root: INFO
    com.spry.oms: DEBUG
    org.springframework: INFO
    org.springframework.web: DEBUG
    org.springframework.data: INFO
    org.hibernate: INFO
    org.hibernate.SQL: DEBUG
  file:
    name: logs/order-management-system.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
